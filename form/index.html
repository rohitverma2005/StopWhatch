<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <form action="">
        <h2>Personal Details</h2><br>
        <label for="name">Name:-</label>
        <input placeholder="Enter your name" name="name" id="name"><br><br>
        <label for="password">Password:-</label>
        <input placeholder="Enter your password" name="password" id="password"><br><br>
        <label for="E-mail id">E-mail id:-</label>
        <input placeholder="Enter your email" name="E-mail" id="E-mail"><br><br>
        <label for="gender">Gender:-</label>
        <input type="radio" name="gender" id="male">Male
        <input type="radio" name="gender" id="femaler">Female
        <input type="radio" name="gender" id="other">Other <br><br>
        <label for="content#">Contect#</label>
        <input type="number" name="content" id="number" placeholder="enter your number"><br><br>
        <h2>Educationl Qualification</h2><br>
        <label for="degree">Degree:-</label>
        <select name="degree" id="degree">
            <option selected>-- select group --</option>
            <option value="B.Com">B.Com</option>
            <option value="B.sc">B.sc</option>
            <option value="B.Com cumputres">B.Com computer</option>
            <option value="B.A">B.A</option>


        </select><br><br>
        
        <label for="engineering">Engineering:-</label>
        <select name="engineering" id="engineering">
            <option selected >-- select group --</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="CIVIL">CIVIL</option>
            <option value="EEE">EEE</option>
        </select><br><br>
        <label for="Hobbies">Hobbies:-</label>
        <input type="checkbox" name="Hobbies" id="music">music
        <input type="checkbox" name="Hobbies" id="cooking">cooking
        <input type="checkbox" name="Hobbies" id="movie">movie
        <input type="checkbox" name="Hobbies" id="singing">singing <br>
        <h2>Address</h2>
        <textarea name="textarea" cols="30" cows="4" id="textarea"></textarea><br>
        <label for="attch resume ">Attch Resume:</label>
        <input type="file" name="filefied" id="filefied"><br><br>
        <i class="fa-solid fa-arrow-up-from-bracket"></i>

        <button>SUBMIT</button>



    </form>
    
    

    
</body>
</html>
